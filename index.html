<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>5×5 Barbell Log</title>
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5×5 Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F5FBF'/%3E%3Cpath d='M14 32h36' stroke='white' stroke-width='5'/%3E%3Crect x='10' y='20' width='7' height='24' rx='2' fill='white'/%3E%3Crect x='47' y='20' width='7' height='24' rx='2' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: single phone-width column, sticky header, fixed bottom tab bar; plate colours follow competition bumper plates */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --sunk:#E3E8EC; --ink:#131A20; --muted:#5A6672; --line:#D3DAE0;
  --accent:#1F5FBF; --accent-ink:#FFFFFF; --soft:#DCE6F5;
  --good:#1D7F47; --good-soft:#D9F0E2; --bad:#B8342A; --bad-soft:#F7DEDB;
  --dance:#8A4FC7; --dance-soft:#EDE3F8; --hiit:#D46A1F; --hiit-soft:#FBE6D6;
  --p25:#C8322B; --p20:#1F5FBF; --p15:#E0AE17; --p10:#2E8B57; --p5:#F5F5F2; --p2:#2A2E33; --p1:#9AA3AB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --nav-h:64px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1317; --surface:#171F26; --sunk:#111820; --ink:#E7ECF0; --muted:#94A1AC; --line:#28333D;
  --accent:#5E96E8; --accent-ink:#08111F; --soft:#1B2B42;
  --good:#52C584; --good-soft:#163024; --bad:#F07463; --bad-soft:#3A1E1B; --p2:#4A5058;
  --dance:#B888EC; --dance-soft:#2C2140; --hiit:#F09A5A; --hiit-soft:#3A2617; color-scheme:dark}}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1;flex:1}
.brand span{color:var(--accent)}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:4px calc(var(--nav-h) + 100px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.01em}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap-r{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;font-weight:600;min-height:46px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--accent);text-transform:uppercase;white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}

/* exercise block */
.ex{display:flex;flex-direction:column;gap:12px;padding-block:14px;border-top:1px solid var(--line)}
.ex:first-child{border-top:0;padding-top:0}
.ex-head{display:flex;align-items:baseline;gap:8px}
.ex-name{font-family:var(--display);font-weight:700;font-size:22px;text-transform:uppercase;flex:1;min-width:0}
.scheme{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted)}
.weight{display:flex;align-items:center;gap:8px}
.step{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);font-size:24px;font-weight:600;line-height:1;flex:none}
.wbox{display:flex;align-items:baseline;gap:4px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:46px}
.wbox input{width:76px;border:0;background:transparent;font-family:var(--display);font-weight:700;font-size:28px;text-align:right;padding:0;height:44px;font-variant-numeric:tabular-nums}
.wbox.small-box input{width:52px;font-size:22px}
.wbox input:focus{outline:none}
.wbox:focus-within{outline:2px solid var(--accent)}
.wbox span{font-weight:600;color:var(--muted)}
.plates{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-height:22px}
.plate{display:inline-grid;place-items:center;height:22px;min-width:22px;padding:0 4px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.plate.p25{background:var(--p25)}.plate.p20{background:var(--p20)}.plate.p15{background:var(--p15);color:#1b1b1b}.plate.p10{background:var(--p10)}
.plate.p5{background:var(--p5);color:#1b1b1b;border:1px solid #c9cdd1}.plate.p2{background:var(--p2)}.plate.p1{background:var(--p1);color:#111}
.sets{display:flex;gap:10px;flex-wrap:wrap}
.set{width:56px;height:56px;border-radius:50%;border:2px dashed var(--muted);background:transparent;font-family:var(--display);font-weight:700;font-size:24px;color:var(--muted);display:grid;place-items:center;font-variant-numeric:tabular-nums;padding:0}
.set:active{transform:scale(.94)}
.set.done{border:2px solid var(--good);background:var(--good);color:#fff}
.set.miss{border:2px solid var(--bad);background:var(--bad-soft);color:var(--bad)}
.x-btn{border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:600;padding:4px}

.lift-line{display:flex;align-items:baseline;gap:10px;padding-block:8px;border-top:1px solid var(--line)}
.lift-line:first-child{border-top:0}
.lift-line .n{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;flex:1;min-width:0}
.lift-line .w{font-family:var(--display);font-weight:700;font-size:24px}
.lift-line .s{color:var(--muted);font-weight:600;min-width:44px;text-align:right}

/* last time, warm-ups, records, notes */
.last{font-size:14px;color:var(--muted);margin-top:-6px}
.last b{color:var(--ink);font-weight:600}
details.warm summary{cursor:pointer;list-style:none;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
details.warm summary::-webkit-details-marker{display:none}
details.warm summary b{color:var(--ink);font-weight:600}
details.warm[open] summary .chev{transform:rotate(90deg)}
.warm-list{display:flex;flex-direction:column;gap:4px;padding:8px 0 2px}
.warm-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.warm-row .wt{min-width:110px;font-weight:600}
.plate.p05{background:var(--p1);color:#111;min-width:18px}
.badge.pr{background:var(--p15);color:#1b1b1b}
.note{width:100%;min-height:64px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
.pr-line{display:flex;gap:10px;align-items:baseline;padding-block:6px;border-top:1px solid var(--line)}
.pr-line:first-child{border-top:0}

/* sets & reps, failure sets */
.scheme-btn{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:2px 10px;font-family:var(--display);font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap}
.set{position:relative}
.set.amrap::after{content:"+";position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 15px/20px var(--body);text-align:center}
.set.picked{outline:3px solid var(--accent);outline-offset:3px}
.amrap-row{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:12px;padding:8px 10px;flex-wrap:wrap}
.amrap-row b.n{font-family:var(--display);font-size:30px;min-width:40px;text-align:center;font-variant-numeric:tabular-nums}

/* cardio + check-in */
.done-btn{background:var(--good)!important;border-color:var(--good)!important;color:#fff!important}
.scale{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.scale button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-variant-numeric:tabular-nums;padding:0;font-size:15px}
.scale button[aria-pressed="true"]{background:var(--pc);border-color:var(--pc);color:#fff}
.ci-label{font-weight:600;font-size:15px;margin-bottom:6px}
.ci-sum{display:flex;gap:6px 16px;flex-wrap:wrap;align-items:baseline}
.ci-sum b{font-family:var(--display);font-size:22px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat .sub{display:block;font-size:12px;color:var(--muted)}

/* calendar */
.cal-head{display:flex;align-items:center;gap:8px}
.cal-head h3{flex:1}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase;padding-bottom:2px}
.day{aspect-ratio:1/1.08;max-width:100%;border-radius:10px;border:1px solid transparent;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 0;gap:3px;font-variant-numeric:tabular-nums;font-size:14px}
.day.out{color:var(--muted);opacity:.45}
.day.today .dn{background:var(--ink);color:var(--bg);border-radius:6px;padding:0 5px}
.day[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.marks{display:flex;gap:2px;justify-content:center;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:700;font-size:13px;width:20px;height:20px;border-radius:7px;display:grid;place-items:center;line-height:1;font-style:normal}
.mark.done{background:var(--good);color:#fff}
.mark.active{background:var(--accent);color:var(--accent-ink)}
.mark.planned{border:2px solid var(--accent);color:var(--accent)}
.mark.missed{border:2px dashed var(--muted);color:var(--muted)}
.mark.dance.done{background:var(--dance);color:#fff}.mark.dance.planned,.mark.dance.suggested{border:2px solid var(--dance);color:var(--dance)}
.mark.hiit.done{background:var(--hiit);color:#fff}.mark.hiit.planned,.mark.hiit.suggested{border:2px solid var(--hiit);color:var(--hiit)}
.mark.suggested{border-style:dashed!important;opacity:.7}
.mark.skipped{border:2px solid var(--line);color:var(--muted);text-decoration:line-through}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:10px;font-size:13px;font-variant-numeric:tabular-nums}
.wd .l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wd.now{background:var(--soft)}
.wd .marks{min-height:20px}
.act-card{border-left-width:4px}
.act-card.dance{border-left-color:var(--dance)}.act-card.hiit{border-left-color:var(--hiit)}
.sel{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:0 10px;font-weight:600;min-width:120px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .mark{width:18px;height:18px;font-size:12px;border-radius:5px}

/* progress */
.chart-box{overflow-x:auto}
.chart-box svg{display:block;width:100%;height:auto;min-width:300px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hist-row{display:grid;grid-template-columns:76px 1fr auto;gap:10px;padding-block:9px;border-top:1px solid var(--line);align-items:baseline;font-variant-numeric:tabular-nums}
.hist-row:first-child{border-top:0}

/* library */
.search{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
details.lib{border-top:1px solid var(--line)}
details.lib:first-child{border-top:0}
details.lib summary{list-style:none;display:flex;align-items:center;gap:10px;padding-block:12px;cursor:pointer}
details.lib summary::-webkit-details-marker{display:none}
details.lib summary .ex-name{font-size:20px}
details.lib[open] summary .chev{transform:rotate(90deg)}
.chev{color:var(--muted);transition:transform .15s}
.guide{padding:0 0 14px;display:flex;flex-direction:column;gap:10px}
.guide ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.guide .mistake{background:var(--bad-soft);border-radius:10px;padding:8px 12px;font-size:14px}
.tag{font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* extras editor */
.xrow{display:flex;align-items:center;gap:8px;padding-block:8px;border-top:1px solid var(--line);flex-wrap:wrap}
.xrow:first-child{border-top:0}
.xrow .nm{flex:1 1 140px;font-weight:600;min-width:0}
.xrow .mini{width:56px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
.tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tab[aria-current="page"]{color:var(--accent)}

/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.timer-in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:14px;padding:10px 14px;display:flex;align-items:center;gap:10px}
.timer-in b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.timer-in button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:10px;padding:7px 10px;font-weight:600;font-size:14px}
.timer.over .timer-in{background:var(--good);color:#fff}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,12,16,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.field{display:flex;align-items:center;gap:10px;padding-block:6px}
.field label{flex:1;font-weight:600}
.banner{background:var(--soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px}
.banner.bad{background:var(--bad-soft)}
.empty{text-align:center;padding:28px 8px;color:var(--muted)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="top"><div class="top-in">
  <div class="brand">5×5 <span>Barbell</span> Log</div>
  <button class="icon-btn" data-a="open-settings" aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</div></header>

<main><div class="wrap" id="view"><div class="empty">Loading…</div></div></main>

<div class="timer" id="timer" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<nav class="tabs" aria-label="Sections"><div class="tabs-in">

const ACT={dance:{name:"Dancing",short:"D",min:120},hiit:{name:"HIIT",short:"H",min:60}};
const EFFORT={easy:"Easy",moderate:"Moderate",hard:"Hard"};

const DEFAULT_WEEK={"1":"dance","2":"gym","4":"hiit","6":"gym"};
const PROGRAM={A:["squat","bench","row"],B:["squat","ohp","deadlift"]};
const MAIN=["squat","bench","row","ohp","deadlift"];
const PLATES=[[25,"p25"],[20,"p20"],[15,"p15"],[10,"p10"],[5,"p5"],[2.5,"p2"],[1.25,"p1"],[0.5,"p05"]];
const KEY="barbell-log-v1";

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ymd(new Date());
const fmtW=w=>String(Math.round(w*100)/100);
const fmtDay=s=>parse(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
const fmtShort=s=>parse(s).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const round25=w=>Math.max(0,Math.round(w/2.5)*2.5);
const roundTo=(w,st)=>Math.max(0,Math.round(w/st)*st);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getInc=k=>(S.settings.scheme&&S.settings.scheme[k]&&S.settings.scheme[k].inc)||LIB[k].inc;
const clone=o=>JSON.parse(JSON.stringify(o));
const other=t=>t==="A"?"B":"A";
const fmtSec=n=>`${Math.floor(n/60)}:${pad(n%60)}`;
function plates(total,bar){
  let side=(total-bar)/2; if(side<=0) return [];
  const out=[]; for(const [p,c] of PLATES){while(side>=p-1e-9){out.push([p,c]);side=Math.round((side-p)*100)/100}} return out;
}
function defaultScheme(){return Object.fromEntries(MAIN.map(k=>[k,{sets:LIB[k].sets,reps:LIB[k].reps,fail:"off"}]))}
const FAILS=[["off","Off"],["last","Last set"],["all","Every set"]];
const failMark=f=>f==="last"?"+":f==="all"?" · F":"";
const schemeLabel=(sc,unit)=>`${sc.sets}×${sc.reps}${unit||""}${failMark(sc.fail)}`;
const isAmrap=(e,j)=>e.fail==="all"||(e.fail==="last"&&j===e.sets.length-1);
function defaults(){
  const lifts={}; MAIN.forEach(k=>lifts[k]={weight:LIB[k].start,fails:0});
  return {lifts,next:"A",bar:20,acc:{},extras:{A:[],B:[]},rest:{main:90,dead:180,fail:300,acc:60},sound:true,started:false,lastBackup:null,week:clone(DEFAULT_WEEK),cardio:{},weighIns:true,scheme:defaultScheme()};
}
function fill(st){ // bring older saved settings up to date
  const d=defaults(); if(!st) return null;
  st.extras=st.extras||d.extras; st.extras.A=st.extras.A||[]; st.extras.B=st.extras.B||[];
  st.rest=Object.assign(d.rest,st.rest||{}); st.acc=st.acc||{}; if(st.sound===undefined) st.sound=true; if(!st.week) st.week=clone(DEFAULT_WEEK); st.cardio=st.cardio||{}; st.scheme=Object.assign(defaultScheme(),st.scheme||{}); if(st.weighIns===undefined) st.weighIns=true;
  MAIN.forEach(k=>{if(!st.lifts[k]) st.lifts[k]=d.lifts[k]}); return st;
}

/* ---------- state + storage (this phone only) ---------- */
const S={warmOpen:{},amrap:null,sch:null,settings:null,sessions:{},acts:{},daily:{},weights:{},ci:null,ciEdit:null,tab:"today",calMonth:null,calSel:today(),progLift:"squat",sheet:null,addTarget:"session",timer:null,confirm:null,importData:null,storageOk:true};
{const d=new Date();S.calMonth=new Date(d.getFullYear(),d.getMonth(),1)}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); S.settings=fill(o.settings||null); S.sessions=o.sessions||{}; S.acts=o.acts||{}; S.daily=o.daily||{}; S.weights=o.weights||{}}}
  catch(e){S.storageOk=false}
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify({settings:S.settings,sessions:S.sessions,acts:S.acts,daily:S.daily,weights:S.weights}));S.storageOk=true}
  catch(e){S.storageOk=false}
}

/* ---------- sessions ---------- */
function newEx(key,sets,reps,minutes,fail){const L=LIB[key];
  if(L.cardio) return {key,cardio:true,minutes:minutes||S.settings.cardio[key]||L.min,km:null,done:false};
  const weight=L.main?S.settings.lifts[key].weight:(S.settings.acc[key]||0);
  const sc=L.main?S.settings.scheme[key]:null;
  return {key,weight,sets:Array(sets||(sc&&sc.sets)||L.sets).fill(null),reps:reps||(sc&&sc.reps)||L.reps,fail:fail||(sc&&sc.fail)||"off"}}
function buildExercises(type){
  return [...PROGRAM[type].map(k=>newEx(k)),...S.settings.extras[type].map(x=>newEx(x.key,x.sets,x.reps,x.minutes,x.fail))];
}
function startSession(date,type){
  const s={date,type,status:"active",exercises:buildExercises(type),started:Date.now()};
  S.sessions[date]=s; save(); return s;
}
function activeSession(){return Object.values(S.sessions).filter(s=>s.status==="active").sort((a,b)=>b.date.localeCompare(a.date))[0]}
const exLogged=e=>e.cardio?!!e.done:e.sets.some(r=>r!==null);
const anyLogged=s=>s.exercises.some(exLogged);
const exSummary=e=>e.cardio?(e.done?`${e.minutes} min${e.km?` · ${fmtW(e.km)} km`:""}`:"not done"):`${fmtW(e.weight)} kg · ${e.sets.map(r=>r===null?"–":r).join("/")}`;
const extraOf=k=>LIB[k].cardio?{key:k,minutes:LIB[k].min}:{key:k,sets:LIB[k].sets,reps:LIB[k].reps};
/* Estimated 1RM (Epley) from the best completed set. Only reps actually done count;
   a session with no completed rep gives no estimate. Capped at 10 reps, where the formula stops being reliable. */
function est1RM(w,sets){
  const r=Math.max(0,...sets.filter(x=>x!==null));
  if(!(w>0)||!(r>0)) return null;
  return r===1?w:w*(1+Math.min(r,10)/30);
}
function switchSession(s){ // swap A/B before any set is logged
  s.type=other(s.type); s.exercises=buildExercises(s.type); save();
}
function computePRs(s){
  const prev=Object.values(S.sessions).filter(x=>x!==s&&x.status==="done");
  const lifted=h=>h.sets&&h.sets.some(r=>r>0);
  s.exercises.forEach(e=>{
    delete e.prs; if(e.cardio) return;
    const done=e.sets.filter(r=>r>0); if(!done.length) return;
    const hist=[]; prev.forEach(x=>x.exercises.forEach(h=>{if(h.key===e.key&&!h.cardio) hist.push(h)}));
    if(!hist.length) return;
    const prs=[];
    if(e.weight>0){const pw=Math.max(0,...hist.filter(lifted).map(h=>h.weight)); if(e.weight>pw) prs.push({t:"weight",v:e.weight})}
    const same=hist.filter(h=>h.weight===e.weight&&lifted(h)), mr=Math.max(...done);
    if(same.length){const pr=Math.max(...same.map(h=>Math.max(0,...h.sets.filter(r=>r!=null)))); if(mr>pr) prs.push({t:"reps",v:mr,w:e.weight})}
    const e1=est1RM(e.weight,e.sets);
    if(e1&&!prs.some(p=>p.t==="weight")){const p1=Math.max(0,...hist.map(h=>est1RM(h.weight,h.sets)||0)); if(e1>p1+0.01) prs.push({t:"e1rm",v:Math.round(e1*2)/2})}
    if(prs.length) e.prs=prs;
  });
}
function prText(e,p){
  if(p.t==="weight") return `Heaviest weight: <b>${fmtW(p.v)} kg</b>`;
  if(p.t==="reps") return `Most reps at ${fmtW(p.w)} kg: <b>${p.v}</b>`;
  return `Best estimated 1RM: <b>${fmtW(p.v)} kg</b>`;
}
function finish(s){
  computePRs(s);
  const st=S.settings;
  s.prev={lifts:clone(st.lifts),next:st.next,acc:clone(st.acc),cardio:clone(st.cardio)};
  s.exercises.forEach(e=>{
    if(e.cardio){ if(e.done) st.cardio[e.key]=e.minutes; return; }
    if(!LIB[e.key].main){ if(e.sets.some(r=>r!==null)) st.acc[e.key]=e.weight; return; }
    const logged=e.sets.some(r=>r!==null); if(!logged){e.result="skipped";return}
    const ok=e.sets.every(r=>r!==null&&r>=e.reps); const L=st.lifts[e.key];
    if(ok){L.weight=Math.round((e.weight+getInc(e.key))*100)/100;L.fails=0;e.result="up"}
    else{L.fails=(L.fails||0)+1; if(L.fails>=3){L.weight=roundTo(e.weight*0.9,Math.min(2.5,getInc(e.key)));L.fails=0;e.result="deload"} else {L.weight=e.weight;e.result="stay"}}
    e.nextWeight=L.weight;
  });
  st.next=other(s.type); s.status="done"; s.finished=Date.now();
  save(); stopTimer();
}
function undoFinish(s){
  if(s.prev){S.settings.lifts=s.prev.lifts;S.settings.next=s.prev.next;if(s.prev.acc)S.settings.acc=s.prev.acc;if(s.prev.cardio)S.settings.cardio=s.prev.cardio}
  delete s.prev; s.status="active"; s.exercises.forEach(e=>{delete e.result;delete e.nextWeight;delete e.prs}); save();
}
function plannedType(date){const s=S.sessions[date]; return s&&s.status==="planned"?s.type:null}

/* ---------- week plan + activities ---------- */
const planFor=k=>S.settings.week[String(parse(k).getDay())]||null;
function actFor(k){ // explicit entry, or a suggestion from the weekly routine for today/future
  if(S.acts[k]) return S.acts[k];
  const p=planFor(k); if((p==="dance"||p==="hiit")&&k>=today()) return {date:k,kind:p,status:"suggested"};
  return null;
}
function gymMark(k){
  const s=S.sessions[k], t=today();
  if(s){const cls=s.status==="planned"&&k<t?"missed":s.status; return `<span class="mark ${cls}">${s.type}</span>`}
  if(planFor(k)==="gym"&&k>=t) return `<span class="mark planned suggested" title="Gym day">G</span>`;
  return "";
}
function actMark(k){
  const a=actFor(k); if(!a) return "";
  const cls=a.status==="planned"&&k<today()?"missed":a.status;
  return `<span class="mark ${a.kind} ${cls}">${ACT[a.kind].short}</span>`;
}
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x}
function nextGymDay(){
  const d=new Date();
  for(let i=0;i<14;i++){const x=new Date(d);x.setDate(d.getDate()+i);const k=ymd(x);
    const s=S.sessions[k]; if(s&&s.status!=="done") return k; if(!s&&planFor(k)==="gym") return k}
  return null;
}
function weekStrip(){
  const st0=weekStart(new Date()), t=today(); let done=0,total=0;
  const cols=[...Array(7)].map((_,i)=>{const d=new Date(st0);d.setDate(st0.getDate()+i);const k=ymd(d);
    const s=S.sessions[k], a=S.acts[k];
    const hasGym=!!s||planFor(k)==="gym", act=a||((planFor(k)==="dance"||planFor(k)==="hiit")?{status:"x"}:null);
    if(hasGym&&!(s&&s.status==="skipped")){total++; if(s&&s.status==="done") done++}
    if(act&&act.status!=="skipped"){total++; if(act.status==="done") done++}
    return `<button class="wd ${k===t?"now":""}" data-a="goto-day" data-d="${k}" aria-label="${fmtDay(k)}"><span class="l">${["Mo","Tu","We","Th","Fr","Sa","Su"][i]}</span><span>${d.getDate()}</span><span class="marks">${gymMark(k)}${actMark(k)}</span></button>`}).join("");
  return `<div class="card"><div class="row"><div class="eyebrow grow">This week</div><span class="badge ${done>=total&&total?"good":""}">${done} of ${total} done</span></div><div class="week">${cols}</div></div>`;
}
function actCard(k,inPanel){
  const a=actFor(k); if(!a) return "";
  const A=ACT[a.kind], o=a.kind==="dance"?"hiit":"dance";
  let body;
  if(a.status==="done"){
    body=`<div class="row"><p class="grow"><b>Done</b> · <span class="num">${a.minutes} min</span></p><button class="btn sm ghost" data-a="act-undo" data-d="${k}">Undo</button></div>
    <div class="row wrap-r"><span class="small muted">How hard was it?</span>${Object.entries(EFFORT).map(([v,l])=>`<button class="chip" data-a="act-effort" data-d="${k}" data-v="${v}" aria-pressed="${a.effort===v}">${l}</button>`).join("")}</div>`;
  } else if(a.status==="skipped"){
    body=`<div class="row"><p class="grow muted">Skipped</p><button class="btn sm ghost" data-a="act-undo" data-d="${k}">Undo</button></div>`;
  } else if(k<=today()){
    body=`<div class="row wrap-r"><div class="wbox small-box"><input id="am-${k}" class="num" type="number" inputmode="numeric" min="1" step="5" value="${a.minutes||A.min}" aria-label="Minutes"><span>min</span></div>
      <button class="btn primary grow" data-a="act-done" data-d="${k}" data-k="${a.kind}">Mark ${A.name.toLowerCase()} done</button></div>
    <div class="row wrap-r"><button class="btn sm" data-a="act-set" data-d="${k}" data-k="${o}">Switch to ${ACT[o].name}</button><button class="btn sm ghost" data-a="act-skip" data-d="${k}" data-k="${a.kind}">Skip</button></div>`;
  } else {
    body=`<div class="row wrap-r"><span class="muted small grow">${a.status==="suggested"?"From your weekly routine":"Planned"}</span><button class="btn sm" data-a="act-set" data-d="${k}" data-k="${o}">Switch to ${ACT[o].name}</button>${a.status==="planned"?`<button class="btn sm ghost" data-a="act-remove" data-d="${k}">Remove</button>`:""}</div>`;
  }
  return `<div class="card act-card ${a.kind}"><div class="row"><div class="grow"><div class="eyebrow">${inPanel?"Activity":k===today()?"Today":fmtDay(k)}</div><h3>${A.name}</h3></div><span class="tag num">${A.min} min usual</span></div>${body}</div>`;
}

/* ---------- daily check-in ---------- */
const STIFF=[["none","None"],["lt30","< 30 min"],["30to60","30–60 min"],["1to2","1–2 h"],["gt2","> 2 h"]];
const STIFFL=Object.fromEntries(STIFF);
const painColor=n=>n==null?"var(--muted)":n<=3?"var(--good)":n<=6?"var(--hiit)":"var(--bad)";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const dayShift=(k,n)=>{const d=parse(k);d.setDate(d.getDate()+n);return ymd(d)};
function lastSleep(){const ks=Object.keys(S.daily).sort().reverse();for(const k of ks){if(S.daily[k].sleep!=null)return S.daily[k].sleep}return 7.5}
function lastWeight(before){const ks=Object.keys(S.weights).filter(d=>!before||d<before).sort();return ks.length?S.weights[ks[ks.length-1]]:null}
function weighDue(k){
  if(!S.settings.weighIns) return false;
  if(S.weights[k]!=null) return true;
  return !Object.keys(S.weights).some(d=>Math.abs(parse(d)-parse(k))/864e5<6);
}
function checkinForm(k){
  const c=S.daily[k]||{};
  if(!S.ci||S.ci.date!==k) S.ci={date:k,pain:c.pain??null,stiff:c.stiff??null};
  const sleep=c.sleep??lastSleep(), lw=lastWeight(k);
  return `<div class="card"><div><div class="eyebrow">${k===today()?"Morning check-in":fmtDay(k)}</div><h3>How did you sleep and feel?</h3></div>
  <div class="field"><label for="ci-sleep">Sleep</label><div class="weight">
    <button type="button" class="step" data-a="ci-sleep" data-d="-0.5" aria-label="Half an hour less">−</button>
    <div class="wbox small-box"><input id="ci-sleep" class="num" type="number" inputmode="decimal" step="0.5" min="0" max="16" value="${fmtW(sleep)}"><span>h</span></div>
    <button type="button" class="step" data-a="ci-sleep" data-d="0.5" aria-label="Half an hour more">+</button></div></div>
  <div><div class="ci-label">Back / hip pain <span class="small muted">0 none · 10 worst</span></div>
    <div class="scale">${[...Array(11)].map((_,n)=>`<button type="button" data-a="ci-pain" data-v="${n}" aria-pressed="${S.ci.pain===n}" style="--pc:${painColor(n)}">${n}</button>`).join("")}</div></div>
  <div><div class="ci-label">Morning stiffness</div>
    <div class="row wrap-r">${STIFF.map(([v,l])=>`<button type="button" class="chip" data-a="ci-stiff" data-v="${v}" aria-pressed="${S.ci.stiff===v}">${l}</button>`).join("")}</div></div>
  ${weighDue(k)?`<div class="field"><label for="ci-weight">Weekly weigh-in<br><span class="small muted">Optional · morning, before eating</span></label><div class="wbox"><input id="ci-weight" class="num" type="number" inputmode="decimal" step="0.1" min="0" value="${S.weights[k]!=null?fmtW(S.weights[k]):""}" placeholder="${lw!=null?fmtW(lw):"–"}"><span>kg</span></div></div>`:""}
  <button type="button" class="btn primary block" data-a="ci-save" data-d="${k}">Save check-in</button></div>`;
}
function checkinSummary(k){
  const c=S.daily[k], w=S.weights[k], parts=[];
  if(c.sleep!=null) parts.push(`<span><b class="num">${fmtW(c.sleep)} h</b> <span class="small muted">sleep</span></span>`);
  if(c.pain!=null) parts.push(`<span><b class="num" style="color:${painColor(c.pain)}">${c.pain}/10</b> <span class="small muted">pain</span></span>`);
  if(c.stiff) parts.push(`<span><b>${STIFFL[c.stiff]}</b> <span class="small muted">stiffness</span></span>`);
  if(w!=null) parts.push(`<span><b class="num">${fmtW(w)} kg</b></span>`);
  const high=k===today()&&c.pain>=7;
  return `<div class="card"><div class="row"><div class="grow"><div class="eyebrow">${k===today()?"Today's check-in":"Check-in"}</div><div class="ci-sum">${parts.join("")||'<span class="muted small">Nothing filled in</span>'}</div></div><button type="button" class="btn sm ghost" data-a="ci-edit" data-d="${k}">Edit</button></div>
  ${high?`<p class="small muted">High pain today. Going lighter, swapping to mobility or easy cardio, or resting are all fine choices. If it stays high for several days, talk to your rheumatologist.</p>`:""}</div>`;
}
const checkinBlock=k=>S.daily[k]&&S.ciEdit!==k?checkinSummary(k):checkinForm(k);
function trainedOn(k){const s=S.sessions[k],a=S.acts[k];if(s&&s.status==="done")return "gym";if(a&&a.status==="done")return a.kind;return null}
function bodyCard(){
  const days=[...Array(28)].map((_,i)=>dayShift(today(),i-27));
  const hasDaily=Object.keys(S.daily).length, wk=Object.keys(S.weights).sort();
  if(!hasDaily&&!wk.length) return `<div class="card"><div class="eyebrow">Body &amp; recovery</div><div class="empty">Your morning check-ins show up here: sleep, back/hip pain next to your training days, and your weekly weight.</div></div>`;
  const last7=days.slice(-7).map(k=>S.daily[k]).filter(Boolean);
  const aS=avg(last7.map(c=>c.sleep).filter(v=>v!=null)), aP=avg(last7.map(c=>c.pain).filter(v=>v!=null));
  const lw=wk.length?S.weights[wk[wk.length-1]]:null;
  const base=wk.find(d=>d>=days[0]); const diff=base&&base!==wk[wk.length-1]?lw-S.weights[base]:null;
  const W=340,H=132,l=24,r=6,tp=8,b=34,ph=H-tp-b,cw=(W-l-r)/28;
  const y=v=>tp+ph*(1-v/10);
  const kc={gym:"var(--accent)",hiit:"var(--hiit)",dance:"var(--dance)"};
  const bars=days.map((k,i)=>{const c=S.daily[k],x=l+i*cw;let o="";
    if(c&&c.pain!=null){const hh=Math.max(ph*c.pain/10,2); o+=`<rect x="${(x+1).toFixed(1)}" y="${(y(0)-hh).toFixed(1)}" width="${(cw-2).toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" fill="${painColor(c.pain)}"/>`}
    const tr=trainedOn(k); if(tr) o+=`<rect x="${(x+cw/2-3).toFixed(1)}" y="${H-b+6}" width="6" height="6" rx="1.5" fill="${kc[tr]}"/>`;
    return o}).join("");
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Back and hip pain over the last 4 weeks, with training days">
    ${[0,5,10].map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("")}
    ${bars}
    <text x="${l}" y="${H-4}" font-size="11" fill="var(--muted)">${fmtShort(days[0])}</text><text x="${W-r}" y="${H-4}" font-size="11" fill="var(--muted)" text-anchor="end">Today</text></svg>`;
  const after={t:[],r:[]}; Object.keys(S.daily).forEach(k=>{const p=S.daily[k].pain; if(p==null) return; (trainedOn(dayShift(k,-1))?after.t:after.r).push(p)});
  const insight=after.t.length>=4&&after.r.length>=4?`<p class="small">Average pain the day after training: <b>${avg(after.t).toFixed(1)}</b> · after a rest day: <b>${avg(after.r).toFixed(1)}</b></p>`:"";
  return `<div class="card"><div class="eyebrow">Body &amp; recovery</div>
    <div class="stats">
      <div class="stat"><small>Sleep</small><b>${aS!=null?fmtW(Math.round(aS*10)/10)+" h":"–"}</b><span class="sub">7-day avg</span></div>
      <div class="stat"><small>Pain</small><b>${aP!=null?aP.toFixed(1):"–"}</b><span class="sub">7-day avg</span></div>
      <div class="stat"><small>Weight</small><b>${lw!=null?fmtW(lw):"–"}</b><span class="sub">${diff!=null?(diff>0?"+":"")+fmtW(Math.round(diff*10)/10)+" kg / 4 wk":"kg"}</span></div></div>
    ${hasDaily?`<div class="chart-box">${svg}</div>
    <div class="legend"><span>Bars: back/hip pain</span><span><i class="mark" style="background:var(--accent);width:10px;height:10px"></i>Gym</span><span><i class="mark" style="background:var(--hiit);width:10px;height:10px"></i>HIIT</span><span><i class="mark" style="background:var(--dance);width:10px;height:10px"></i>Dancing</span></div>${insight}`:""}
    ${wk.length>=2?`<div class="eyebrow">Body weight</div><div class="chart-box">${chart(wk.map(d=>({d,w:S.weights[d],ok:true})),"Body weight over time")}</div>`:""}
  </div>`;
}

/* ---------- views ---------- */
function setupView(){
  const st=S.settings||defaults();
  return `<div><div class="eyebrow">Set up</div><h2>Starting weights</h2></div>
  <div class="card"><p class="muted small">StrongLifts starts light on purpose: the empty 20 kg bar for squat, bench and press, 30 kg rows and 40 kg deadlifts. You add 2.5 kg every successful session (5 kg on deadlift). Enter heavier numbers if you already train.</p>
  ${MAIN.map(k=>`<div class="field"><label for="su-${k}">${LIB[k].name}</label><div class="wbox"><input id="su-${k}" class="num" type="number" inputmode="decimal" step="2.5" min="0" value="${fmtW(st.lifts[k].weight)}"><span>kg</span></div></div>`).join("")}
  <div class="field"><label>First workout</label><div class="row"><button class="chip" data-a="setup-next" data-t="A" aria-pressed="${st.next==="A"}">A</button><button class="chip" data-a="setup-next" data-t="B" aria-pressed="${st.next==="B"}">B</button></div></div>
  <button class="btn primary block" data-a="setup-done">Start program</button></div>
  <div class="card small muted"><p>Already have a backup file? <button class="btn sm" data-a="import">Restore backup</button></p></div>`;
}

function lastPerf(key,before){
  const list=Object.values(S.sessions).filter(x=>x.status==="done"&&x.date<before).sort((a,b)=>b.date.localeCompare(a.date));
  for(const x of list){const e=x.exercises.find(e=>e.key===key&&exLogged(e)); if(e) return {date:x.date,e}}
  return null;
}
function lastLine(s,e){
  const lp=lastPerf(e.key,s.date); if(!lp) return "";
  return `<div class="last">Last time, ${fmtShort(lp.date)}: <b>${exSummary(lp.e)}</b></div>`;
}
function warmupSets(e){
  const L=LIB[e.key]; if(!L.bar) return [];
  const bar=S.settings.bar, w=e.weight; if(!(w>bar)) return [];
  const out=e.key==="deadlift"?[]:[{w:bar,r:5,n:2}];
  [[0.4,5],[0.6,3],[0.8,2]].forEach(([f,r])=>{
    const x=Math.floor(w*f/2.5)*2.5, prev=out.length?out[out.length-1].w:0;
    if(x>bar&&x<w&&x-prev>=5) out.push({w:x,r,n:1});
  });
  if(!out.length) out.push({w:bar,r:5,n:1});
  return out;
}
function warmups(e){
  const ws=warmupSets(e); if(!ws.length) return "";
  const bar=S.settings.bar, lab=x=>`${x.w===bar?"bar ":fmtW(x.w)}${x.n>1?x.n+"×":"×"}${x.r}`;
  const rows=ws.map(x=>`<div class="warm-row"><span class="wt">${x.w===bar?"Empty bar":fmtW(x.w)+" kg"} · ${x.n>1?x.n+" × ":""}${x.r}</span><span class="plates">${plates(x.w,bar).map(([p,c])=>`<span class="plate ${c}">${fmtW(p)}</span>`).join("")}</span></div>`).join("");
  return `<details class="warm" data-k="${e.key}" ${S.warmOpen[e.key]?"open":""}><summary><span class="chev">›</span><span>Warm-up: <b>${ws.map(lab).join(" · ")}</b></span></summary><div class="warm-list">${rows}</div></details>`;
}
function exBlock(s,e,i){
  const L=LIB[e.key]; const unit=L.unit||"";
  if(L.cardio) return `<div class="ex">
    <div class="ex-head"><div class="ex-name">${L.name}</div><div class="scheme">Cardio</div><button type="button" class="x-btn" data-a="rm-ex" data-i="${i}">Remove</button></div>
    ${lastLine(s,e)}
    <div class="row wrap-r"><div class="weight">
      <button type="button" class="step" data-a="cmin" data-i="${i}" data-d="-5" aria-label="5 minutes less">−</button>
      <div class="wbox small-box"><input id="cm-${s.date}-${i}" class="num" type="number" inputmode="numeric" min="1" data-cm="${i}" value="${e.minutes}" aria-label="${L.name} minutes"><span>min</span></div>
      <button type="button" class="step" data-a="cmin" data-i="${i}" data-d="5" aria-label="5 minutes more">+</button></div>
      <div class="wbox small-box"><input id="ck-${s.date}-${i}" class="num" type="number" inputmode="decimal" step="0.1" min="0" data-ck="${i}" value="${e.km!=null?fmtW(e.km):""}" placeholder="–" aria-label="${L.name} distance, optional"><span>km</span></div>
    </div>
    <button type="button" class="btn block ${e.done?"done-btn":""}" data-a="cdone" data-i="${i}">${e.done?"✓ Done":"Mark done"}</button>
  </div>`;
  const step=L.main?Math.min(2.5,getInc(e.key)):L.bar?2.5:1;
  const bubbles=e.sets.map((r,j)=>{
    const cls=(r===null?"":(r>=e.reps?"done":"miss"))+(isAmrap(e,j)?" amrap":"")+(S.amrap&&S.amrap.i===i&&S.amrap.j===j?" picked":"");
    return `<button type="button" class="set ${cls}" data-a="set" data-i="${i}" data-j="${j}" aria-label="Set ${j+1}: ${r===null?"not done":r+" reps"}">${r===null?j+1:r}</button>`}).join("");
  let info="";
  if(L.bar) info=plates(e.weight,S.settings.bar).map(([p,c])=>`<span class="plate ${c}">${fmtW(p)}</span>`).join("")||`<span class="small muted">Empty bar</span>`;
  else if(L.bw) info=`<span class="small muted">${e.weight>0?"Added weight":"Bodyweight"}</span>`;
  return `<div class="ex">
    <div class="ex-head"><div class="ex-name">${L.name}</div><button type="button" class="scheme-btn" data-a="scheme" data-i="${i}" aria-label="Change sets and reps">${e.sets.length}×${e.reps}${unit}${failMark(e.fail)}</button>${L.main?"":`<button type="button" class="x-btn" data-a="rm-ex" data-i="${i}">Remove</button>`}</div>
    ${lastLine(s,e)}${warmups(e)}
    <div class="row wrap-r"><div class="weight">
      <button type="button" class="step" data-a="w" data-i="${i}" data-d="${-step}" aria-label="Less weight">−</button>
      <div class="wbox"><input id="w-${s.date}-${i}" class="num" type="number" inputmode="decimal" step="0.5" min="0" data-w="${i}" value="${fmtW(e.weight)}" aria-label="${L.name} weight"><span>kg</span></div>
      <button type="button" class="step" data-a="w" data-i="${i}" data-d="${step}" aria-label="More weight">+</button></div>
      <div class="plates grow">${info}</div>
    </div>
    <div class="sets">${bubbles}</div>
    ${S.amrap&&S.amrap.i===i&&e.sets[S.amrap.j]!=null?`<div class="amrap-row"><span class="small" style="flex:1 1 100%"><b>Set ${S.amrap.j+1} · to failure.</b> <span class="muted">Target ${e.reps}${unit}. Log every rep you got.</span></span>
      <button type="button" class="step" data-a="amrap" data-d="-1" aria-label="One rep less">−</button><b class="n">${e.sets[S.amrap.j]}</b><button type="button" class="step" data-a="amrap" data-d="1" aria-label="One rep more">+</button><span class="grow"></span>
      <button type="button" class="btn sm ghost" data-a="amrap-clear">Clear</button><button type="button" class="btn sm" data-a="amrap-close">OK</button></div>`:""}
  </div>`;
}

function sessionView(s){
  const late=s.date!==today()?` · ${fmtDay(s.date)}`:"";
  const canSwitch=!anyLogged(s);
  return `<div class="row"><div class="grow"><div class="eyebrow">In progress${late}</div><h2>Workout ${s.type}</h2></div>
    ${canSwitch?`<button class="btn sm" data-a="switch-active">Switch to ${other(s.type)}</button>`:""}</div>
  <div class="card"><div>${s.exercises.map((e,i)=>exBlock(s,e,i)).join("")}</div>
    <button class="btn ghost block" data-a="open-add" data-target="session">+ Add exercise</button></div>
  <p class="muted small">Tap a circle when you finish that set; the rest timer starts on its own. Missed reps? Keep tapping to count down to what you got. Circles with a + are failure sets: tap, then use − / + to log every rep you got. Tap the sets × reps label to change it.</p>
  <div><label class="ci-label" for="note-${s.date}" style="display:block">Note <span class="small muted">optional</span></label>
  <textarea class="note" id="note-${s.date}" data-note="1" maxlength="300" placeholder="e.g. left hip tight, went lighter on squats">${esc(s.note||"")}</textarea></div>
  <div class="btn-row"><button class="btn" data-a="manual-rest">Start rest timer</button><button class="btn primary" data-a="finish">Finish workout</button></div>
  ${S.daily[today()]?"":`<button class="btn ghost block" data-a="ci-edit" data-d="${today()}">Log today's check-in</button>`}
  <button class="btn ${S.confirm==="discard"?"danger":"ghost"} block" data-a="discard">${S.confirm==="discard"?"Tap again to delete this workout":"Discard workout"}</button>`;
}

function resultBadge(e){
  if(e.result==="up") return `<span class="badge good">Next ${fmtW(e.nextWeight)}</span>`;
  if(e.result==="deload") return `<span class="badge bad">Deload ${fmtW(e.nextWeight)}</span>`;
  if(e.result==="stay") return `<span class="badge">Repeat ${fmtW(e.nextWeight)}</span>`;
  return "";
}
function prCard(s){
  const lines=[]; s.exercises.forEach(e=>(e.prs||[]).forEach(p=>lines.push(`<div class="pr-line"><span class="badge pr">PR</span><span class="grow"><b>${LIB[e.key].name}</b> · ${prText(e,p)}</span></div>`)));
  return lines.length?`<div class="card"><div class="eyebrow">New records</div><div>${lines.join("")}</div></div>`:"";
}
function doneView(s){

function nextCard(compact,ng){

  const fails=PROGRAM[type].filter(k=>st.lifts[k].fails>0).map(k=>`${LIB[k].name}: ${st.lifts[k].fails} failed session${st.lifts[k].fails>1?"s":""} in a row`);
  return `<div class="card"><div class="row"><div class="grow"><div class="eyebrow">${compact?"Next session":"Next gym session"}${when}</div><h3>Workout ${type}</h3></div>

function backupNudge(){
  const done=Object.values(S.sessions).filter(s=>s.status==="done").length;

  return "";
}

      <button class="icon-btn" data-a="cal-move" data-d="1" aria-label="Next month"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button></div>

    <div class="legend"><span><i class="mark done">A</i>Done</span><span><i class="mark planned">B</i>Planned</span><span><i class="mark missed">A</i>Missed</span><span><i class="mark active">A</i>In progress</span><span><i class="mark dance done">D</i>Dancing</span><span><i class="mark hiit done">H</i>HIIT</span><span><i class="mark planned suggested">G</i>Routine</span></div>
  </div>

function dayPanel(k){
  const s=S.sessions[k], t=today(), act=activeSession();
  let body;
  if(!s){
    body=`<p class="muted small">No workout on this day.</p>
    <div class="row wrap-r"><button class="btn sm" data-a="plan" data-d="${k}" data-t="A">Plan A</button><button class="btn sm" data-a="plan" data-d="${k}" data-t="B">Plan B</button>
    ${k<=t&&!act?`<button class="btn sm primary" data-a="start-here" data-d="${k}">Log a workout here</button>`:""}</div>`;
  } else if(s.status==="planned"){
    body=`<p><span class="badge">Workout ${s.type}</span> ${k<t?'<span class="muted small">Not logged</span>':""}</p>
    <div class="row wrap-r"><button class="btn sm" data-a="plan" data-d="${k}" data-t="${other(s.type)}">Switch to ${other(s.type)}</button><button class="btn sm" data-a="unplan" data-d="${k}">Remove</button>
    ${k<=t&&!act?`<button class="btn sm primary" data-a="start-here" data-d="${k}">Log it</button>`:""}</div>`;
  } else {
    const lines=s.exercises.map(e=>`<div class="lift-line"><span class="n">${LIB[e.key].name}</span><span class="muted small num">${exSummary(e)}</span></div>`).join("");
    body=`<p><span class="badge ${s.status==="done"?"good":""}">Workout ${s.type} · ${s.status==="done"?"done":"in progress"}</span></p><div>${lines}</div>${s.note?`<p class="small muted">Note: ${esc(s.note)}</p>`:""}
    ${s.status==="active"?`<button class="btn sm primary" data-a="tab" data-tab="today">Continue</button>`:""}`;
  }
  const a=actFor(k);
  const actBlock=a?actCard(k,true):`<div class="card"><div class="eyebrow">Activity</div><div class="row wrap-r">${Object.entries(ACT).map(([kk,A])=>`<button class="btn sm" data-a="${k<=t?"act-log":"act-set"}" data-d="${k}" data-k="${kk}">${k<=t?"Log":"Plan"} ${A.name.toLowerCase()}</button>`).join("")}</div></div>`;
  const ciB=k<=t?(S.daily[k]?checkinSummary(k):`<div class="card"><div class="row"><p class="grow small muted">No check-in for this day.</p><button class="btn sm" data-a="ci-edit" data-d="${k}">Add check-in</button></div></div>`):"";
  return `<div class="card"><div class="eyebrow">${fmtDay(k)} · Gym</div>${body}</div>${actBlock}${ciB}`;
}

function chart(points,label){
  const W=340,H=190,l=40,r=14,tp=14,b=26;
  const ws=points.map(p=>p.w); let lo=Math.min(...ws), hi=Math.max(...ws);
  const step=hi-lo>40?10:5; lo=Math.max(0,Math.floor((lo-2.5)/step)*step); hi=Math.ceil((hi+2.5)/step)*step;
  const n=Math.round((hi-lo)/step), every=Math.ceil(n/4), ticks=[];
  for(let v=lo;v<=hi+1e-9;v+=step*every) ticks.push(v);
  const x=i=>points.length===1?l+(W-l-r)/2:l+i*(W-l-r)/(points.length-1);
  const y=v=>tp+(H-tp-b)*(1-(v-lo)/(hi-lo));
  const line=points.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.w).toFixed(1)}`).join("");
  const area=`${line}L${x(points.length-1).toFixed(1)},${y(lo)}L${x(0).toFixed(1)},${y(lo)}Z`;
  const last=points[points.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${label||"Working weight over time"}">
    ${ticks.map(v=>`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${l-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtW(v)}</text>`).join("")}
    <path d="${area}" fill="var(--soft)" stroke="none"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
    ${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===points.length-1?5:3.2}" fill="${p.ok?"var(--accent)":"var(--surface)"}" stroke="${p.ok?"var(--accent)":"var(--bad)"}" stroke-width="2"/>`).join("")}
    <text x="${x(0)}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="${points.length===1?"middle":"start"}">${fmtShort(points[0].d)}</text>
    ${points.length>1?`<text x="${W-r}" y="${H-6}" font-size="11" fill="var(--muted)" text-anchor="end">${fmtShort(last.d)}</text>`:""}
  </svg>`;
}

function progressView(){
  const done=Object.values(S.sessions).filter(s=>s.status==="done").sort((a,b)=>a.date.localeCompare(b.date));
  const used=new Set(); done.forEach(s=>s.exercises.forEach(e=>{if(!e.cardio&&LIB[e.key]&&LIB[e.key].cat!=="Mobility"&&!LIB[e.key].unit) used.add(e.key)}));
  const opts=[...MAIN,...[...used].filter(k=>!LIB[k].main&&LIB[k])];
  if(!opts.includes(S.progLift)) S.progLift="squat";
  const k=S.progLift, L=LIB[k];
  const pts=[]; done.forEach(s=>s.exercises.forEach(e=>{if(e.key===k&&e.sets.some(r=>r!==null)){
    const ok=e.sets.every(r=>r!==null&&r>=e.reps);
    pts.push({d:s.date,w:e.weight,ok,pr:!!e.prs,reps:e.sets,e1rm:est1RM(e.weight,e.sets),any:e.sets.some(r=>r>0)})}}));
  const chips=opts.map(m=>`<button class="chip" data-a="prog" data-k="${m}" aria-pressed="${m===k}">${LIB[m].name}</button>`).join("");
  const cur=L.main?S.settings.lifts[k].weight:(S.settings.acc[k]||0);
  const lifted=pts.filter(p=>p.any); const best=lifted.length?Math.max(...lifted.map(p=>p.w)):0;
  const e1s=pts.map(p=>p.e1rm).filter(v=>v); const e1=e1s.length?Math.max(...e1s):0;
  const thisMonth=done.filter(s=>s.date.startsWith(today().slice(0,7))).length;
  return `<div><div class="eyebrow">${done.length} workout${done.length===1?"":"s"} logged · ${thisMonth} this month</div><h2>Progress</h2></div>
  ${activitySummary(done)}
  <div class="row wrap-r">${chips}</div>
  <div class="card">
    <div class="stats"><div class="stat"><small>Next</small><b>${fmtW(cur)}</b></div><div class="stat"><small>Heaviest</small><b>${best?fmtW(best):"–"}</b></div><div class="stat"><small>Est. 1RM</small><b>${e1?fmtW(Math.round(e1*2)/2):"–"}</b></div></div>
    ${pts.length?`<div class="chart-box">${chart(pts)}</div><p class="small muted">Weight in kg per session. Hollow dots are sessions where you missed reps. Est. 1RM uses your best set, counting only reps you completed (Epley formula). Your sets of 5 stop short of failure, so the real number is usually a little higher.</p>`:`<div class="empty">Finish a workout with ${L.name.toLowerCase()} and its weight shows up here.</div>`}
  </div>
  ${pts.length?`<div class="card"><div class="eyebrow">History</div><div>${pts.slice().reverse().slice(0,12).map(p=>`<div class="hist-row"><span class="muted small">${fmtShort(p.d)}</span><span><b>${fmtW(p.w)} kg</b>${p.pr?' <span class="badge pr">PR</span>':""}</span><span class="small ${p.ok?"":"muted"}">${p.reps.map(r=>r===null?"–":r).join("/")}</span></div>`).join("")}</div></div>`:""}
  ${bodyCard()}`;
}

function activitySummary(done){
  const m=today().slice(0,7);
  const gym=done.filter(s=>s.date.startsWith(m)).length;
  const acts=Object.values(S.acts).filter(a=>a.status==="done"&&a.date.startsWith(m));
  const cnt=k=>acts.filter(a=>a.kind===k); const mins=k=>cnt(k).reduce((x,a)=>x+(a.minutes||0),0);
  const h=n=>n>=60?`${Math.round(n/6)/10} h`:`${n} min`;
  const cardioMin=done.filter(s=>s.date.startsWith(m)).reduce((x,s)=>x+s.exercises.filter(e=>e.cardio&&e.done).reduce((y,e)=>y+(e.minutes||0),0),0);
  return `<div class="card"><div class="eyebrow">This month</div><div class="stats two">
    <div class="stat"><small>Gym</small><b>${gym}</b></div>
    <div class="stat"><small>HIIT</small><b>${cnt("hiit").length}</b><span class="small muted">${h(mins("hiit"))}</span></div>
    <div class="stat"><small>Dancing</small><b>${cnt("dance").length}</b><span class="small muted">${h(mins("dance"))}</span></div>
    <div class="stat"><small>Gym cardio</small><b>${h(cardioMin)}</b></div></div></div>`;
}

  <div class="card small muted"><p><b>How progression works.</b> Hit every rep on every set and the lift goes up 2.5 kg next time (deadlift 5 kg). Miss reps and you repeat the weight. Miss three sessions in a row and it drops 10%. Extra exercises remember the weight you used last.</p></div>`;
}

function addSheet(){
  const target=S.addTarget; const s=activeSession();
  const have=new Set(target==="session"?(s?s.exercises.map(e=>e.key):[]):[...PROGRAM[target],...S.settings.extras[target].map(x=>x.key)]);
  const cats={}; Object.entries(LIB).forEach(([k,e])=>{if(!have.has(k))(cats[e.cat]=cats[e.cat]||[]).push([k,e])});
  return `<div class="row"><h3 class="grow">${target==="session"?"Add to today":"Add to workout "+target}</h3><button class="btn sm" data-a="close-add">Close</button></div>
  ${target==="session"?`<p class="small muted">Only for this session. To add something every time, use “Add to workout A/B” in the exercise guide or settings.</p>`:""}
  ${Object.entries(cats).map(([c,l])=>`<div class="card"><div class="eyebrow">${c}</div><div class="row wrap-r">${l.map(([k,e])=>`<button class="chip" data-a="add-ex" data-k="${k}">${e.name}</button>`).join("")}</div></div>`).join("")}`;
}

function schemeSheet(){
  const c=S.sch, L=LIB[c.key], unit=L.unit==="s"?"sec":"reps";
  const presets=L.unit==="s"?[[2,30],[3,30],[3,45],[3,60]]:[[5,5],[3,5],[5,3],[4,6],[3,8],[4,8],[3,10],[3,12],[1,5]];
  const s0=activeSession();
  const canKeep=c.ctx==="session"&&s0&&(L.main||S.settings.extras[s0.type].some(x=>x.key===c.key));
  const stepper=(f,label,max)=>`<div class="field"><label for="sch-${f}">${label}</label><div class="weight">
    <button type="button" class="step" data-a="sch-step" data-f="${f}" data-d="-1" aria-label="Fewer ${label}">−</button>
    <div class="wbox small-box"><input id="sch-${f}" class="num" type="number" inputmode="numeric" min="1" max="${max}" value="${c[f]}"></div>
    <button type="button" class="step" data-a="sch-step" data-f="${f}" data-d="1" aria-label="More ${label}">+</button></div></div>`;
  return `<div class="row"><h3 class="grow">${L.name}</h3><button class="btn sm" data-a="close">Close</button></div>
  <div class="card"><div class="eyebrow">Sets × ${unit}</div>
    <div class="row wrap-r">${presets.map(([a,b])=>`<button type="button" class="chip" data-a="sch-preset" data-s="${a}" data-r="${b}" aria-pressed="${c.sets===a&&c.reps===b}">${a}×${b}${L.unit||""}</button>`).join("")}</div>
    ${stepper("sets","Sets",10)}${stepper("reps",unit==="sec"?"Seconds":"Reps",unit==="sec"?600:100)}</div>
  <div class="card"><div class="eyebrow">To failure</div>
    <div class="row wrap-r">${FAILS.map(([v,l])=>`<button type="button" class="chip" data-a="sch-fail" data-v="${v}" aria-pressed="${c.fail===v}">${l}</button>`).join("")}</div>
    <p class="small muted">On a failure set you keep going until you can't do another clean rep, then log what you got. Reaching the target still counts as a success.${L.main?" Leave a rep in the tank on squats, bench and deadlifts unless you have a spotter or safety arms.":""}</p></div>
  ${c.ctx==="main"?`<div class="card"><div class="eyebrow">Weight jump after a successful session</div>
    <div class="row wrap-r">${[1,2.5,5].map(v=>`<button type="button" class="chip" data-a="sch-inc" data-v="${v}" aria-pressed="${c.inc===v}">+${fmtW(v)} kg</button>`).join("")}</div>
    <p class="small muted">+1 kg needs 0.5 kg plates. Smaller jumps help bench and overhead press keep moving once 2.5 kg gets too big.</p></div>`:""}
  ${L.main?`<p class="small muted">Progression works the same with any scheme: hit the target on every set and the weight goes up next time.</p>`:""}
  ${c.ctx==="session"?(canKeep?`<div class="btn-row"><button class="btn" data-a="sch-save" data-keep="0">Just today</button><button class="btn primary" data-a="sch-save" data-keep="1">Today and from now on</button></div>`:`<button class="btn primary block" data-a="sch-save" data-keep="0">Save for today</button>`)
    :`<button class="btn primary block" data-a="sch-save" data-keep="1">Save</button>`}`;
}
function syncSch(){
  const c=S.sch; if(!c) return;
  const g=(id,max)=>{const el=document.getElementById(id); const v=parseInt(el&&el.value,10); return isNaN(v)?null:Math.min(max,Math.max(1,v))};
  const a=g("sch-sets",10), b=g("sch-reps",600); if(a) c.sets=a; if(b) c.reps=b;
}

/* ---------- render ---------- */
function render(){
  const v=document.getElementById("view");
  let html=S.storageOk?"":`<div class="banner bad">This browser isn't letting the page save data (private browsing?). Open it in a normal tab so your workouts are kept.</div>`;
  if(!S.settings||!S.settings.started) html+=setupView();
  else html+=({today:todayView,calendar:calendarView,progress:progressView,library:libraryView})[S.tab]();
  const y=window.scrollY; v.innerHTML=html;
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===S.tab?"page":"false"));
  renderSheet(); window.scrollTo(0,y); syncWake();
}
function renderSheet(){
  const root=document.getElementById("sheet-root");
  const prev=root.querySelector(".sheet"); const sy=prev?prev.scrollTop:0;
  if(S.sheet&&S.settings&&S.settings.started){
    root.innerHTML=`<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">${S.sheet==="settings"?settingsSheet():S.sheet==="scheme"?schemeSheet():S.sheet==="checkin"?`<div class="row"><h3 class="grow">Check-in</h3><button class="btn sm" data-a="close">Close</button></div>${checkinForm(S.ciEdit)}`:addSheet()}</div></div>`;
    const sh=root.querySelector(".sheet"); if(sh&&prev) sh.scrollTop=sy;
  } else root.innerHTML="";
}
let toastT=null;
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2400)}

/* ---------- rest timer ---------- */
let tick=null, actx=null;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()} if(actx&&actx.state==="suspended")actx.resume()}catch(e){}}
function beep(){
  if(!S.settings.sound) return;
  try{navigator.vibrate&&navigator.vibrate([250,120,250])}catch(e){}
  try{if(!actx) return; const t0=actx.currentTime;
    [0,0.3,0.6].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001,t0+o);g.gain.exponentialRampToValueAtTime(0.4,t0+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+o+0.22);os.start(t0+o);os.stop(t0+o+0.25)})}catch(e){}
}
function startTimer(sec,label){if(sec<=0)return;S.timer={end:Date.now()+sec*1000,label,alerted:false};clearInterval(tick);tick=setInterval(drawTimer,250);drawTimer()}
function stopTimer(){S.timer=null;clearInterval(tick);drawTimer()}
function drawTimer(){
  const el=document.getElementById("timer");
  if(!S.timer){el.hidden=true;return}
  const left=Math.round((S.timer.end-Date.now())/1000);
  if(left<=0&&!S.timer.alerted){S.timer.alerted=true;beep()}
  el.hidden=false; el.classList.toggle("over",left<=0);
  el.innerHTML=`<div class="timer-in"><div class="grow small">${left>0?"Rest · "+S.timer.label:"Rest done. Next set!"}</div><b>${left<0?"+":""}${fmtSec(Math.abs(left))}</b><button data-a="timer-add">+30s</button><button data-a="timer-stop">${left>0?"Skip":"OK"}</button></div>`;
}
function restFor(ex,missed){
  const r=S.settings.rest, L=LIB[ex.key];
  if(missed) return r.fail; if(!L.main) return r.acc; return ex.key==="deadlift"?r.dead:r.main;
}

/* ---------- backup ---------- */
function exportData(){
  S.settings.lastBackup=Date.now(); save();
  const data=JSON.stringify({app:"barbell-log",version:1,exported:new Date().toISOString().slice(0,10)+"T00:00:00",settings:S.settings,sessions:S.sessions,acts:S.acts,daily:S.daily,weights:S.weights},null,1);
  const blob=new Blob([data],{type:"application/json"}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=`barbell-log-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Backup saved"); render();
}
document.getElementById("import-file").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
  const rd=new FileReader(); rd.onload=()=>{
    try{const o=JSON.parse(rd.result); if(o.app!=="barbell-log"||!o.settings||!o.sessions) throw 0;
      if(!S.settings||!S.settings.started){S.settings=fill(o.settings);S.sessions=o.sessions;S.acts=o.acts||{};S.daily=o.daily||{};S.weights=o.weights||{};save();toast("Backup restored");render();return}
      S.importData=o; S.sheet="settings"; render();
    }catch(err){toast("That file isn't a 5×5 Log backup")}
  }; rd.readAsText(f);
});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-a]"); if(!b) return;
  const a=b.dataset.a, st=S.settings;
  if(a==="scrim"&&e.target!==b) return;
  if(a!=="discard"&&S.confirm){S.confirm=null}
  unlockAudio();
  switch(a){
    case "tab": S.tab=b.dataset.tab; S.sheet=null; render(); window.scrollTo(0,0); break;
    case "setup-next":{S.settings=S.settings||defaults(); S.settings.next=b.dataset.t; render(); break;}
    case "setup-done":{
      const s=S.settings||defaults();
      MAIN.forEach(k=>{const v=parseFloat(document.getElementById("su-"+k).value); if(!isNaN(v)&&v>=0) s.lifts[k].weight=v});
      s.started=true; S.settings=s; save(); render(); break;}
    case "start": S.amrap=null; startSession(b.dataset.d,b.dataset.t); render(); window.scrollTo(0,0); break;
    case "start-here":{const k=b.dataset.d; startSession(k,plannedType(k)||st.next); S.tab="today"; render(); window.scrollTo(0,0); break;}
    case "switch-next":{
      const t=today(), cur=b.dataset.t;
      if(plannedType(t)){S.sessions[t].type=other(cur)} else st.next=other(cur);
      save(); toast(`Switched to workout ${other(cur)}`); render(); break;}
    case "switch-active":{const s=activeSession(); if(s&&!anyLogged(s)){switchSession(s); toast(`Switched to workout ${s.type}`); render()} break;}
    case "set":{
      const s=activeSession(); if(!s) break;
      const ex=s.exercises[+b.dataset.i]; const j=+b.dataset.j; const r=ex.sets[j];
      if(isAmrap(ex,j)){
        const i=+b.dataset.i, selected=S.amrap&&S.amrap.i===i&&S.amrap.j===j;
        if(r===null){ex.sets[j]=ex.reps; S.amrap={i,j}; save(); render(); startTimer(restFor(ex,false),LIB[ex.key].name)}
        else {S.amrap=selected?null:{i,j}; render()}
        break;
      }
      const nv=r===null?ex.reps:(r>0?r-1:null); ex.sets[j]=nv; save(); render();
      if(r===null) startTimer(restFor(ex,false),LIB[ex.key].name);
      else if(r===ex.reps&&nv!==null) startTimer(restFor(ex,true),"after missed reps");
      else if(nv===null) stopTimer();
      break;}
    case "w":{const s=activeSession(); if(!s) break; const ex=s.exercises[+b.dataset.i]; ex.weight=Math.max(0,Math.round((ex.weight+parseFloat(b.dataset.d))*100)/100); save(); render(); break;}
    case "manual-rest": startTimer(st.rest.main,"manual"); break;
    case "finish":{S.amrap=null; const s=activeSession(); if(s){finish(s); render(); window.scrollTo(0,0)} break;}
    case "discard":{if(S.confirm==="discard"){const s=activeSession(); S.confirm=null; if(s){delete S.sessions[s.date]; save()} stopTimer(); render()} else {S.confirm="discard"; render()} break;}
    case "undo":{const s=S.sessions[b.dataset.d]; if(s&&!activeSession()){undoFinish(s); render()} else toast("Finish or discard your current workout first"); break;}
    case "open-add": S.addTarget=b.dataset.target; S.sheet="add"; render(); break;
    case "close-add": S.sheet=S.addTarget==="session"?null:"settings"; render(); break;
    case "add-ex":{
      const k=b.dataset.k;
      if(S.addTarget==="session"){const s=activeSession(); if(s){s.exercises.push(newEx(k)); save()} S.sheet=null}
      else {st.extras[S.addTarget].push(extraOf(k)); save(); toast(`${LIB[k].name} added to workout ${S.addTarget}`); S.sheet="settings"}
      render(); break;}
    case "toggle-extra":{
      const t=b.dataset.t,k=b.dataset.k,list=st.extras[t],i=list.findIndex(x=>x.key===k);
      if(i>=0){list.splice(i,1); toast(`Removed from workout ${t}`)} else {list.push(extraOf(k)); toast(`Added to workout ${t}`)}
      save();
      b.textContent=i>=0?"Add to workout "+t:"✓ In workout "+t; break;}
    case "rm-extra":{st.extras[b.dataset.t].splice(+b.dataset.i,1); save(); render(); break;}
    case "rm-ex":{const s=activeSession(); if(s){s.exercises.splice(+b.dataset.i,1); save(); render()} break;}
    case "open-settings": if(st&&st.started){S.sheet="settings"; render()} break;
    case "close": case "scrim": if(S.sheet==="scheme"&&S.sch&&S.sch.ctx!=="session"){S.sheet="settings";S.sch=null;render();break} S.sheet=null; S.importData=null; S.ciEdit=null; S.ci=null; render(); break;
    case "save-weights":{
      MAIN.forEach(k=>{const v=parseFloat(document.getElementById("st-"+k).value); if(!isNaN(v)&&v>=0&&v!==st.lifts[k].weight){st.lifts[k].weight=v;st.lifts[k].fails=0}});
      const bar=parseFloat(document.getElementById("st-bar").value); if(!isNaN(bar)&&bar>=0) st.bar=bar;
      save(); toast("Weights saved"); render(); break;}
    case "save-rest":{
      [["main","rs-main"],["dead","rs-dead"],["fail","rs-fail"],["acc","rs-acc"]].forEach(([k,id])=>{const v=parseInt(document.getElementById(id).value,10); if(!isNaN(v)&&v>=0) st.rest[k]=v});
      save(); toast("Rest times saved"); render(); break;}
    case "sound": st.sound=b.dataset.v==="1"; save(); renderSheet(); if(st.sound) beep(); break;
    case "export": exportData(); break;
    case "import": document.getElementById("import-file").click(); break;
    case "import-confirm":{const o=S.importData; S.settings=fill(o.settings); S.sessions=o.sessions; S.acts=o.acts||{};S.daily=o.daily||{};S.weights=o.weights||{}; S.importData=null; save(); toast("Backup restored"); S.sheet=null; render(); break;}
    case "import-cancel": S.importData=null; render(); break;
    case "cal-move": S.calMonth=new Date(S.calMonth.getFullYear(),S.calMonth.getMonth()+parseInt(b.dataset.d,10),1); render(); break;
    case "cal-day": S.calSel=b.dataset.d; render(); break;
    case "plan":{const k=b.dataset.d; S.sessions[k]={date:k,type:b.dataset.t,status:"planned"}; save(); render(); break;}
    case "unplan": delete S.sessions[b.dataset.d]; save(); render(); break;
    case "autoplan":{
      let type=st.next, n=0; const d=new Date();
      for(let i=0;i<28;i++){
        const dd=new Date(d); dd.setDate(d.getDate()+i); const k=ymd(dd), p=st.week[String(dd.getDay())];
        if(p==="gym"){
          if(S.sessions[k]){ if(S.sessions[k].status!=="done") type=other(S.sessions[k].type); continue }
          S.sessions[k]={date:k,type,status:"planned"}; type=other(type); n++;
        } else if((p==="dance"||p==="hiit")&&!S.acts[k]){S.acts[k]={date:k,kind:p,status:"planned"}; n++}
      }
      save(); toast(n?`Planned ${n} sessions`:"Those days are already planned"); render(); break;}
    case "prog": S.progLift=b.dataset.k; render(); break;
    case "amrap":{const s=activeSession(); if(!s||!S.amrap) break; const ex=s.exercises[S.amrap.i]; const r=ex.sets[S.amrap.j]; if(r==null) break;
      ex.sets[S.amrap.j]=Math.max(0,Math.min(100,r+parseInt(b.dataset.d,10))); save(); render(); break;}
    case "amrap-clear":{const s=activeSession(); if(s&&S.amrap){s.exercises[S.amrap.i].sets[S.amrap.j]=null; save()} S.amrap=null; render(); break;}
    case "amrap-close": S.amrap=null; render(); break;
    case "scheme":{const s=activeSession(); if(!s) break; const i=+b.dataset.i, ex=s.exercises[i];
      S.sch={ctx:"session",i,key:ex.key,sets:ex.sets.length,reps:ex.reps,fail:ex.fail||"off"}; S.sheet="scheme"; render(); break;}
    case "scheme-main":{const k=b.dataset.k, sc=st.scheme[k]; S.sch={ctx:"main",key:k,sets:sc.sets,reps:sc.reps,fail:sc.fail||"off",inc:getInc(k)}; S.sheet="scheme"; render(); break;}
    case "scheme-extra":{const t=b.dataset.t, xi=+b.dataset.xi, x=st.extras[t][xi]; S.sch={ctx:"extra",t,xi,key:x.key,sets:x.sets,reps:x.reps,fail:x.fail||"off"}; S.sheet="scheme"; render(); break;}
    case "scheme-reset": st.scheme=defaultScheme(); save(); toast("Back to 5×5"); renderSheet(); break;
    case "sch-preset": syncSch(); S.sch.sets=+b.dataset.s; S.sch.reps=+b.dataset.r; renderSheet(); break;
    case "sch-step":{syncSch(); const f=b.dataset.f; S.sch[f]=Math.max(1,Math.min(f==="sets"?10:600,S.sch[f]+parseInt(b.dataset.d,10))); renderSheet(); break;}
    case "sch-fail": syncSch(); S.sch.fail=b.dataset.v; renderSheet(); break;
    case "sch-inc": syncSch(); S.sch.inc=+b.dataset.v; renderSheet(); break;
    case "sch-save":{
      syncSch(); const c=S.sch, keep=b.dataset.keep==="1", sc={sets:c.sets,reps:c.reps,fail:c.fail};
      if(c.ctx==="session"){
        const s=activeSession(); if(s){const ex=s.exercises[c.i];
          ex.sets=ex.sets.slice(0,c.sets).concat(Array(Math.max(0,c.sets-ex.sets.length)).fill(null)); ex.reps=c.reps; ex.fail=c.fail;
          if(keep){ if(LIB[c.key].main) st.scheme[c.key]=Object.assign({},st.scheme[c.key],sc); else {const x=st.extras[s.type].find(x=>x.key===c.key); if(x) Object.assign(x,sc)} }}
        S.amrap=null; S.sheet=null;
      } else if(c.ctx==="main"){ st.scheme[c.key]=Object.assign({},st.scheme[c.key],sc,{inc:c.inc}); S.sheet="settings" }
      else { Object.assign(st.extras[c.t][c.xi],sc); S.sheet="settings" }
      S.sch=null; save(); toast(keep&&c.ctx==="session"?"Saved for today and future workouts":"Saved"); render(); break;}
    case "cmin":{const s=activeSession(); if(!s) break; const ex=s.exercises[+b.dataset.i]; ex.minutes=Math.max(1,(ex.minutes||0)+parseInt(b.dataset.d,10)); save(); render(); break;}
    case "cdone":{const s=activeSession(); if(!s) break; const ex=s.exercises[+b.dataset.i]; ex.done=!ex.done; save(); render(); break;}
    case "weighins": st.weighIns=b.dataset.v==="1"; save(); renderSheet(); break;
    case "ci-edit":{const k=b.dataset.d; S.ciEdit=k; S.ci=null; if(!(k===today()&&S.tab==="today"&&!activeSession())) S.sheet="checkin"; render(); break;}
    case "ci-sleep":{const inp=document.getElementById("ci-sleep"); const v=(parseFloat(inp.value)||0)+parseFloat(b.dataset.d); inp.value=fmtW(Math.min(16,Math.max(0,v))); break;}
    case "ci-pain": case "ci-stiff":{
      const f=a==="ci-pain"?"pain":"stiff", v=f==="pain"?+b.dataset.v:b.dataset.v;
      if(!S.ci) break; S.ci[f]=S.ci[f]===v?null:v;
      b.parentElement.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",String((f==="pain"?+x.dataset.v:x.dataset.v)===S.ci[f]))); break;}
    case "ci-save":{
      const k=b.dataset.d, sl=parseFloat(document.getElementById("ci-sleep").value);
      S.daily[k]={sleep:isNaN(sl)?null:Math.min(16,Math.max(0,sl)),pain:S.ci?S.ci.pain:null,stiff:S.ci?S.ci.stiff:null};
      const wi=document.getElementById("ci-weight"); if(wi){const w=parseFloat(wi.value); if(w>0) S.weights[k]=Math.round(w*10)/10; else delete S.weights[k]}
      S.ci=null; S.ciEdit=null; if(S.sheet==="checkin") S.sheet=null; save(); toast("Check-in saved"); render(); break;}
    case "goto-day": S.calSel=b.dataset.d; {const x=parse(b.dataset.d); S.calMonth=new Date(x.getFullYear(),x.getMonth(),1)} S.tab="calendar"; render(); window.scrollTo(0,0); break;
    case "act-done":{const k=b.dataset.d; const inp=document.getElementById("am-"+k); const m=parseInt(inp&&inp.value,10);
      S.acts[k]=Object.assign(S.acts[k]||{date:k},{kind:b.dataset.k,status:"done",minutes:m>0?m:ACT[b.dataset.k].min}); save(); toast(`${ACT[b.dataset.k].name} logged`); render(); break;}
    case "act-log":{const k=b.dataset.d; S.acts[k]={date:k,kind:b.dataset.k,status:"planned"}; save(); render(); break;}
    case "act-set":{const k=b.dataset.d; const cur=S.acts[k]; S.acts[k]=Object.assign(cur||{date:k,status:"planned"},{kind:b.dataset.k}); if(S.acts[k].status==="suggested") S.acts[k].status="planned"; save(); render(); break;}
    case "act-skip":{const k=b.dataset.d; S.acts[k]={date:k,kind:b.dataset.k,status:"skipped"}; save(); render(); break;}
    case "act-undo":{const a=S.acts[b.dataset.d]; if(a){a.status="planned"; delete a.effort} save(); render(); break;}
    case "act-remove": delete S.acts[b.dataset.d]; save(); render(); break;
    case "act-effort":{const a=S.acts[b.dataset.d]; if(a){a.effort=a.effort===b.dataset.v?undefined:b.dataset.v; save(); render()} break;}
    case "timer-add": if(S.timer){S.timer.end=Math.max(Date.now(),S.timer.end)+30000; S.timer.alerted=false; drawTimer()} break;
    case "timer-stop": stopTimer(); break;
  }
});

  if(d.w!==undefined){const s=activeSession(); if(!s) return; const v=parseFloat(t.value); if(!isNaN(v)&&v>=0){s.exercises[+d.w].weight=v; save()} setTimeout(render,0); return}
  if(d.wk!==undefined){const v=t.value; if(v) S.settings.week[d.wk]=v; else delete S.settings.week[d.wk]; save(); toast("Routine saved"); return}
  if(d.cm!==undefined){const s=activeSession(); if(!s) return; const v=parseInt(t.value,10); if(v>0){s.exercises[+d.cm].minutes=v; save()} return}
  if(d.ck!==undefined){const s=activeSession(); if(!s) return; const v=parseFloat(t.value); s.exercises[+d.ck].km=v>0?Math.round(v*100)/100:null; save(); return}
  if(d.xt){const x=S.settings.extras[d.xt][+d.xi]; const v=parseInt(t.value,10); if(x&&!isNaN(v)&&v>0){x[d.f]=Math.min(v,d.f==="sets"?10:300); save()} return}
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.note){const s=activeSession(); if(s){s.note=e.target.value.slice(0,300); save()} return}
  if(e.target.id!=="lib-search") return; const q=e.target.value.trim().toLowerCase();
  document.querySelectorAll("details.lib").forEach(d=>{d.hidden=!!q&&!d.dataset.text.includes(q)});
  document.querySelectorAll(".lib-cat").forEach(c=>{c.hidden=!c.querySelector("details.lib:not([hidden])")});
});
let wake=null, wakeBusy=false;
async function syncWake(){
  if(wakeBusy||!("wakeLock" in navigator)) return;
  const want=!!activeSession()&&document.visibilityState==="visible";
  wakeBusy=true;
  try{
    if(want&&!wake){wake=await navigator.wakeLock.request("screen"); wake.addEventListener("release",()=>{wake=null})}
    else if(!want&&wake){await wake.release(); wake=null}
  }catch(err){wake=null}
  wakeBusy=false;
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.timer) drawTimer(); syncWake()});
document.addEventListener("toggle",e=>{const d=e.target; if(d.classList&&d.classList.contains("warm")) S.warmOpen[d.dataset.k]=d.open},true);

/* ---------- boot ---------- */
load(); render();
</script>
</body>
</html>
